name: Release

# タグを打つとリリース資産をCIでビルドし、ビルドプロベナンスを付けて公開する。
# 社員は BRAT でこのリリースを追うため、ここに添付された main.js / manifest.json /
# styles.css がそのまま各自の Vault に届く。ビルド時に何も注入しないので、
# タグから `npm ci && npm run build` すれば同じ main.js が再現できる。
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to"
        required: true

permissions:
  contents: write # リリースの作成と資産のアップロード
  id-token: write # プロベナンス署名に使う OIDC トークン
  attestations: write # アテステーションの記録

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `install` ではなく `ci`。バージョンはコミット済みのロックファイルが決める。
      - run: npm ci

      - name: Verify manifest version matches the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG manifest=$MANIFEST package=$PKG"
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag, manifest.json and package.json versions must all match."
            exit 1
          fi
          if [ "$(node -p "require('./versions.json')['$TAG'] || ''")" = "" ]; then
            echo "::error::versions.json has no entry for $TAG."
            exit 1
          fi

      - run: npm run build

      - name: Report asset digests
        run: sha256sum main.js manifest.json styles.css

      # このバイト列がこのリポジトリの、このワークフローの、このコミットから出たことの証明。
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" main.js manifest.json styles.css --clobber
